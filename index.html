  <meta charset="UTF-8" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3a7d44" />

<body>

  <div class="wrap">

    <div class="index-header">
      <h1 class="index-title">Recetas</h1>
      <p class="index-count" id="count"></p>
    </div>

    <div class="cook-soon-shelf" id="soonShelf" hidden>
      <div class="shelf-head">
        <h2 class="shelf-title">★ Para cocinar pronto</h2>
        <button class="shopping-toggle" id="shoppingToggle">Lista de compras</button>
      </div>
      <div class="shopping-list" id="shoppingList" hidden></div>
      <div class="recipe-grid" id="soonGrid"></div>
    </div>

    <div class="controls">
      <input class="search-input" id="search" type="search" placeholder="Buscar por nombre o etiqueta…" autocomplete="off" />
      <select class="sort-select" id="sort">
        <option value="recent">Más recientes</option>
        <option value="oldest">Más antiguas</option>
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
        <option value="source">Origen (A–Z)</option>
      </select>
      <button class="edit-toggle" id="editToggle" hidden>Editar etiquetas</button>
      <span class="save-status" id="saveStatus"></span>
    </div>

    <div class="filters" id="filters"></div>

    <div class="editor" id="editor" hidden></div>

    <div class="recipe-grid" id="grid"></div>
    <p class="empty-state" id="empty" hidden>No hay recetas que calcen con esa búsqueda.</p>

  </div>

  <script>
    const COMBINING = new RegExp('[\\u0300-\\u036f]', 'g');
    const norm = s => (s || '').normalize('NFD').replace(COMBINING, '').toLowerCase();
    const slugify = s => norm(s).trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    const AXIS_LABELS = { tipo: 'Tipo', base: 'Base', contexto: 'Contexto' };

    // Con el dev-server las marcas van a recipes.json; si no, a localStorage.
    const HTTP = location.protocol === 'http:' || location.protocol === 'https:';
    let SERVER = false;

    let DATA = JSON.parse(document.getElementById('catalog').textContent);
    const state = { query: '', tags: new Set(), sort: 'recent', editing: false, shopping: false };

    const grid       = document.getElementById('grid');
    const empty      = document.getElementById('empty');
    const count      = document.getElementById('count');
    const filters    = document.getElementById('filters');
    const editor     = document.getElementById('editor');
    const editToggle = document.getElementById('editToggle');
    const saveStatus = document.getElementById('saveStatus');
    const soonShelf  = document.getElementById('soonShelf');
    const soonGrid   = document.getElementById('soonGrid');
    const shoppingList   = document.getElementById('shoppingList');
    const shoppingToggle = document.getElementById('shoppingToggle');

    const STAR_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

    /* ── Guardado ── */
    let saveTimer = null;

    function save() {
      clearTimeout(saveTimer);
      saveStatus.textContent = 'Guardando…';
      saveStatus.className = 'save-status';
      saveTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/catalog', {
            method: 'PUT',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(DATA),
          });
          const body = await res.json();
          if (!res.ok) {
            saveStatus.textContent = (body.errors && body.errors.length ? body.errors : [body.error]).join(' · ');
            saveStatus.className = 'save-status error';
            return;
          }
          saveStatus.textContent = 'Guardado';
          saveStatus.className = 'save-status ok';
        } catch (err) {
          saveStatus.textContent = 'No se pudo guardar: ' + err.message;
          saveStatus.className = 'save-status error';
        }
      }, 400);
    }

    /* ── Guardado sin dev-server: las estrellas viven en este navegador ── */
    const LOCAL_KEY = 'recetas:cook-soon';

    function applyLocalSoon() {
      let marked;
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (!raw) return;
        marked = new Set(JSON.parse(raw));
      } catch {
        return;
      }
      for (const r of DATA.recipes) r.cookSoon = marked.has(r.slug);
    }

    function saveLocal() {
      const marked = DATA.recipes.filter(r => r.cookSoon).map(r => r.slug);
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(marked));
        saveStatus.textContent = 'Guardado en este navegador';
        saveStatus.className = 'save-status ok';
      } catch {
        saveStatus.textContent = 'Este navegador no deja guardar las marcas.';
        saveStatus.className = 'save-status error';
      }
    }

    /* ── Vocabulario ── */
    const allTags = () => Object.values(DATA.tags).flat();

    function addTag(axis, raw) {
      const tag = slugify(raw);
      if (!tag) return 'El nombre queda vacío.';
      if (allTags().includes(tag)) return `"${tag}" ya existe.`;
      DATA.tags[axis].push(tag);
      return null;
    }

    function renameTag(axis, oldTag, raw) {
      const tag = slugify(raw);
      if (!tag) return 'El nombre queda vacío.';
      if (tag === oldTag) return null;
      if (allTags().includes(tag)) return `"${tag}" ya existe.`;
      DATA.tags[axis][DATA.tags[axis].indexOf(oldTag)] = tag;
      for (const r of DATA.recipes) {
        const i = r.tags.indexOf(oldTag);
        if (i !== -1) r.tags[i] = tag;
      }
      if (state.tags.delete(oldTag)) state.tags.add(tag);
      return null;
    }

    function deleteTag(axis, tag) {
      DATA.tags[axis].splice(DATA.tags[axis].indexOf(tag), 1);
      for (const r of DATA.recipes) {
        const i = r.tags.indexOf(tag);
        if (i !== -1) r.tags.splice(i, 1);
      }
      state.tags.delete(tag);
    }

    function usageCount(tag) {
      return DATA.recipes.filter(r => r.tags.includes(tag)).length;
    }

    /* ── Filtros ── */
    function renderFilters() {
      filters.replaceChildren();

      for (const [axis, tags] of Object.entries(DATA.tags)) {
        const row = document.createElement('div');
        row.className = 'filter-axis';

        const label = document.createElement('span');
        label.className = 'axis-label';
        label.textContent = AXIS_LABELS[axis] || axis;
        row.appendChild(label);

        for (const tag of tags) {
          const chip = document.createElement('button');
          chip.className = 'tag-chip' + (state.tags.has(tag) ? ' active' : '');
          chip.textContent = tag;
          chip.addEventListener('click', () => {
            state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag);
            renderFilters();
            render();
          });
          row.appendChild(chip);
        }
        filters.appendChild(row);
      }

      if (state.tags.size) {
        const clear = document.createElement('button');
        clear.className = 'clear-filters';
        clear.textContent = 'Limpiar filtros';
        clear.addEventListener('click', () => {
          state.tags.clear();
          renderFilters();
          render();
        });
        filters.appendChild(clear);
      }
    }

    /* ── Editor de vocabulario ── */
    function renderEditor() {
      editor.replaceChildren();
      if (!state.editing) return;

      const intro = document.createElement('p');
      intro.className = 'editor-intro';
      intro.textContent = 'Click en una etiqueta para renombrarla, en × para borrarla. Los cambios se guardan solos en recipes.json.';
      editor.appendChild(intro);

      for (const [axis, tags] of Object.entries(DATA.tags)) {
        const row = document.createElement('div');
        row.className = 'editor-axis';

        const label = document.createElement('span');
        label.className = 'axis-label';
        label.textContent = AXIS_LABELS[axis] || axis;
        row.appendChild(label);

        for (const tag of tags) {
          const group = document.createElement('span');
          group.className = 'editor-tag';

          const name = document.createElement('button');
          name.className = 'editor-tag-name';
          name.textContent = tag;
          name.title = 'Renombrar';
          name.addEventListener('click', () => {
            const nuevo = prompt(`Renombrar "${tag}" (se aplica a las ${usageCount(tag)} receta(s) que la usan):`, tag);
            if (nuevo === null) return;
            const err = renameTag(axis, tag, nuevo);
            if (err) return alert(err);
            renderAll();
            save();
          });

          const del = document.createElement('button');
          del.className = 'editor-tag-del';
          del.textContent = '×';
          del.title = 'Eliminar';
          del.addEventListener('click', () => {
            const n = usageCount(tag);
            const msg = n
              ? `¿Eliminar "${tag}"? Se va a quitar de ${n} receta(s).`
              : `¿Eliminar "${tag}"?`;
            if (!confirm(msg)) return;
            deleteTag(axis, tag);
            renderAll();
            save();
          });

          group.append(name, del);
          row.appendChild(group);
        }

        const add = document.createElement('button');
        add.className = 'editor-add';
        add.textContent = '+ nueva';
        add.addEventListener('click', () => {
          const nombre = prompt(`Nueva etiqueta en "${AXIS_LABELS[axis] || axis}":`);
          if (nombre === null) return;
          const err = addTag(axis, nombre);
          if (err) return alert(err);
          renderAll();
          save();
        });
        row.appendChild(add);

        editor.appendChild(row);
      }
    }

    /* ── Grilla ── */
    function matches(recipe) {
      for (const tag of state.tags) {
        if (!recipe.tags.includes(tag)) return false;
      }
      if (!state.query) return true;
      const haystack = norm(recipe.title + ' ' + recipe.tags.join(' '));
      return state.query.split(/\s+/).every(word => haystack.includes(word));
    }

    function sorted(list) {
      const by = {
        recent: (a, b) => b.dateAdded.localeCompare(a.dateAdded),
        oldest: (a, b) => a.dateAdded.localeCompare(b.dateAdded),
        az:     (a, b) => a.title.localeCompare(b.title, 'es'),
        za:     (a, b) => b.title.localeCompare(a.title, 'es'),
        source: (a, b) => {
          const an = a.source && a.source.name;
          const bn = b.source && b.source.name;
          if (an && bn) return an.localeCompare(bn, 'es') || a.title.localeCompare(b.title, 'es');
          if (an && !bn) return -1;
          if (!an && bn) return 1;
          return a.title.localeCompare(b.title, 'es');
        },
      };
      return list.slice().sort(by[state.sort]);
    }

    function thumb(recipe) {
      if (recipe.image) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = recipe.image;
        img.alt = recipe.title;
        img.loading = 'lazy';
        return img;
      }
      const ph = document.createElement('div');
      ph.className = 'card-placeholder';
      const span = document.createElement('span');
      span.textContent = recipe.title;
      ph.appendChild(span);
      return ph;
    }

    function card(recipe) {
      const el = document.createElement(state.editing ? 'div' : 'a');
      el.className = 'recipe-card-link' + (state.editing ? ' editing' : '');
      if (!state.editing) el.href = 'recipes/' + recipe.slug + '.html';

      el.appendChild(thumb(recipe));

      const star = document.createElement('button');
      star.className = 'card-star' + (recipe.cookSoon ? ' active' : '');
      star.innerHTML = STAR_SVG;
      star.title = recipe.cookSoon ? 'Quitar de "cocinar pronto"' : 'Marcar para cocinar pronto';
      star.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        recipe.cookSoon = !recipe.cookSoon;
        if (SERVER) save(); else saveLocal();
        render();
      });
      el.appendChild(star);

      const body = document.createElement('div');
      body.className = 'card-body';

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = recipe.title;
      body.appendChild(title);

      if (state.editing) {
        const open = document.createElement('a');
        open.className = 'card-open';
        open.href = 'recipes/' + recipe.slug + '.html';
        open.textContent = 'Abrir receta →';
        body.appendChild(open);

        const chips = document.createElement('div');
        chips.className = 'card-tags';
        for (const tag of allTags()) {
          const chip = document.createElement('button');
          chip.className = 'card-tag-chip' + (recipe.tags.includes(tag) ? ' active' : '');
          chip.textContent = tag;
          chip.addEventListener('click', () => {
            const i = recipe.tags.indexOf(tag);
            i === -1 ? recipe.tags.push(tag) : recipe.tags.splice(i, 1);
            chip.classList.toggle('active');
            save();
          });
          chips.appendChild(chip);
        }
        body.appendChild(chips);
      } else {
        const meta = document.createElement('p');
        meta.className = 'card-meta';
        const time = document.createElement('span');
        time.textContent = recipe.time.label;
        const serves = document.createElement('span');
        serves.textContent = recipe.servings + (recipe.servings === '1' ? ' porción' : ' porciones');
        meta.append(time, serves);
        if (recipe.source && recipe.source.name) {
          const source = document.createElement('span');
          source.textContent = recipe.source.name;
          meta.appendChild(source);
        }
        body.appendChild(meta);
      }

      el.appendChild(body);
      return el;
    }

    function render() {
      const list = sorted(DATA.recipes.filter(matches));

      grid.replaceChildren(...list.map(card));
      empty.hidden = list.length > 0;

      const total = DATA.recipes.length;
      count.textContent = list.length === total
        ? total + (total === 1 ? ' receta' : ' recetas')
        : list.length + ' de ' + total;

      renderShelf();
    }

    function renderShelf() {
      const soon = sorted(DATA.recipes.filter(r => r.cookSoon));
      soonGrid.replaceChildren(...soon.map(card));
      soonShelf.hidden = state.editing || soon.length === 0;
      renderShopping();
    }

    /* ── Lista de compras ──
       Agrupa por ingrediente y suma solo lo que comparte unidad. Las unidades
       distintas del mismo item quedan como sumandos separados (1 tbsp + 2 tsp):
       combinarlas es un refinamiento pendiente, no se inventa la conversion. */
    const FRACTIONS = { 0.125: '⅛', 0.25: '¼', 0.333: '⅓', 0.5: '½', 0.667: '⅔', 0.75: '¾' };

    function fmtQty(n) {
      if (n === null) return '';
      const whole = Math.floor(n);
      const glyph = FRACTIONS[+(n - whole).toFixed(3)];
      if (glyph) return (whole || '') + glyph;
      return String(+n.toFixed(2));
    }

    function shoppingItems() {
      const bag = new Map();
      for (const r of DATA.recipes.filter(r => r.cookSoon)) {
        for (const ing of r.ingredients) {
          let entry = bag.get(ing.item);
          if (!entry) {
            entry = { item: ing.item, optional: true, parts: new Map(), recipes: new Set() };
            bag.set(ing.item, entry);
          }
          // Opcional en una receta pero obligatorio en otra -> hay que comprarlo.
          if (!ing.optional) entry.optional = false;
          entry.recipes.add(r.title);

          const unit = ing.unit || '';
          const prev = entry.parts.get(unit);
          if (prev === undefined) entry.parts.set(unit, ing.qty);
          else entry.parts.set(unit, prev === null || ing.qty === null ? null : prev + ing.qty);
        }
      }
      return [...bag.values()].sort((a, b) => a.item.localeCompare(b.item, 'es'));
    }

    function renderShopping() {
      shoppingToggle.textContent = state.shopping ? 'Ocultar lista' : 'Lista de compras';
      shoppingToggle.classList.toggle('active', state.shopping);
      shoppingList.hidden = !state.shopping;
      if (!state.shopping) return;

      const items = shoppingItems();
      shoppingList.replaceChildren();

      const intro = document.createElement('p');
      intro.className = 'shopping-intro';
      intro.textContent = items.length + (items.length === 1 ? ' ingrediente' : ' ingredientes')
        + ' de ' + DATA.recipes.filter(r => r.cookSoon).length + ' receta(s). '
        + 'Los tildes no se guardan.';
      shoppingList.appendChild(intro);

      const ul = document.createElement('ul');
      ul.className = 'shopping-items';

      for (const entry of items) {
        const li = document.createElement('li');
        li.className = 'shopping-item';

        const label = document.createElement('label');

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.addEventListener('change', () => label.classList.toggle('done', box.checked));
        label.appendChild(box);

        const qty = [...entry.parts.entries()]
          .map(([unit, n]) => (fmtQty(n) + ' ' + unit).trim())
          .filter(Boolean)
          .join(' + ');

        if (qty) {
          const q = document.createElement('span');
          q.className = 'shopping-qty';
          q.textContent = qty;
          label.appendChild(q);
        }

        const name = document.createElement('span');
        name.className = 'shopping-name';
        name.textContent = entry.item;
        label.appendChild(name);

        if (entry.optional) {
          const opt = document.createElement('span');
          opt.className = 'shopping-optional';
          opt.textContent = 'opcional';
          label.appendChild(opt);
        }

        const from = document.createElement('span');
        from.className = 'shopping-from';
        from.textContent = [...entry.recipes].join(' · ');
        label.appendChild(from);

        li.appendChild(label);
        ul.appendChild(li);
      }

      shoppingList.appendChild(ul);
    }

    function renderAll() {
      renderFilters();
      renderEditor();
      render();
    }

    /* ── Controles ── */
    document.getElementById('search').addEventListener('input', e => {
      state.query = norm(e.target.value);
      render();
    });
    document.getElementById('sort').addEventListener('change', e => {
      state.sort = e.target.value;
      render();
    });

    shoppingToggle.addEventListener('click', () => {
      state.shopping = !state.shopping;
      renderShopping();
    });

    editToggle.addEventListener('click', () => {
      state.editing = !state.editing;
      editToggle.classList.toggle('active', state.editing);
      editToggle.textContent = state.editing ? 'Listo' : 'Editar etiquetas';
      editor.hidden = !state.editing;
      if (!state.editing) saveStatus.textContent = '';
      renderAll();
    });

    /* ── Arranque ── */
    (async () => {
      if (HTTP) {
        try {
          DATA = await (await fetch('/api/catalog')).json();
          SERVER = true;
          editToggle.hidden = false;
        } catch {
          // Servido por HTTP pero sin el dev-server: las etiquetas no se editan.
        }
      }
      if (!SERVER) applyLocalSoon();
      renderAll();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
